name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libsdl2-dev libfreetype6-dev libjson-c-dev ffmpeg python3
      - name: Private-content guard
        run: bash tools/scan_private.sh
      - name: Native suite
        run: bash tests/run_liljack_native_tests.sh
      - name: Python proofs
        run: bash tests/run_liljack_python_tests.sh
